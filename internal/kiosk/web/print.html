<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Печать документа — PrintStart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user">
  <div class="screen source-pick">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
    </header>

    <header class="top top-nav">
      <a class="back-btn" href="/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="page-head">
      <h1 class="page-title">Печать документа</h1>
      <p class="page-subtitle">Выберите, откуда загрузить документ</p>
    </section>

    <main class="actions" aria-label="Источники печати">
      <a class="source-card featured" id="source-usb" href="/print/usb/">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--usb" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">USB-флешка</div>
          <div class="action-description">Выберите документ с флешки</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="source-card green" id="source-email" href="/print/email/">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--mail" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">Email</div>
          <div class="action-description">Отправьте документ на почту терминала</div>
          <div class="source-meta">
            <span class="source-email" id="terminal-email" hidden></span>
          </div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="source-card max" id="source-max" href="/print/max/">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--max" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">MAX</div>
          <div class="action-description">Отправьте документ боту в MAX</div>
          <div class="source-qr" id="max-qr" hidden aria-hidden="true"></div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>
    </main>

    <p class="source-privacy-note">
      <span aria-hidden="true">✓</span>
      Ваши файлы защищены и удаляются после завершения печати
    </p>
  </div>
  <script src="/static/ui.js"></script>
  <script>
    function setShown(id, on) {
      const el = document.getElementById(id);
      if (el) el.hidden = !on;
    }

    (async () => {
      try {
        const info = await fetch('/api/kiosk/info').then((r) => r.json()).catch(() => ({}));
        setShown('source-usb', info.source_usb !== false);
        setShown('source-email', info.source_email === true);
        setShown('source-max', info.source_max === true);
      } catch (e) {}
      try {
        const res = await fetch('/api/kiosk/email/info');
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.email_address) {
          const el = document.getElementById('terminal-email');
          el.hidden = false;
          el.textContent = data.email_address;
        }
      } catch (e) {}
    })();
  </script>
  <script src="/static/idle.js"></script>
</body>
</html>
