<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Печать документа — PrintStart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="screen">
    <header class="top top-nav">
      <a class="back-btn" href="/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="hero compact">
      <h1>Печать документа</h1>
      <p>Выберите источник файла</p>
    </section>

    <main class="actions" aria-label="Источники печати">
      <a class="action-card" href="/print/usb/">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="8" rx="1"/>
              <path d="M7 10h10a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3z"/>
              <path d="M10 14h4M10 17h4"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Печать с USB</div>
          <div class="action-description">Выберите файл с флешки</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="action-card green" href="/print/email/">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 7 9-7"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Печать с Email</div>
          <div class="action-description">Документ из входящей почты</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="action-card purple" href="/print/telegram/">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 5L2 12.5l6.5 1.8L16 9l-6 7.2 1.2 5.3L21 5z"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Печать с Telegram</div>
          <div class="action-description">Файл из сообщения боту</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>
    </main>
  </div>
  <script src="/static/idle.js"></script>
</body>
</html>
