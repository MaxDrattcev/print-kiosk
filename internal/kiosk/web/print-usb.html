<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Печать с USB</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user">
  <div class="screen">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
      <a class="specialist-link" href="/admin/">Вход для специалиста</a>
    </header>
    <header class="top top-nav">
      <a class="back-btn" href="/print/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="prompt-card">
      <div class="prompt-icon" aria-hidden="true">
        <svg viewBox="0 0 96 96" fill="none">
          <rect x="34" y="12" width="28" height="28" rx="6" fill="#3d7eff"/>
          <rect x="22" y="36" width="52" height="42" rx="10" fill="#5b9bff"/>
          <rect x="34" y="48" width="28" height="8" rx="4" fill="#fff"/>
          <rect x="34" y="62" width="28" height="8" rx="4" fill="#fff"/>
          <circle cx="48" cy="22" r="4" fill="#fff"/>
        </svg>
      </div>
      <h1>Вставьте флешку в USB-разъём</h1>
      <p>После подключения нажмите «Продолжить», чтобы открыть файлы на накопителе</p>
      <p class="error" id="error" hidden></p>
      <button type="button" class="primary-btn" id="continue-btn">Продолжить</button>
    </section>

    <div class="wave" aria-hidden="true"></div>
  </div>

  <dialog class="modal" id="drives-modal">
    <form method="dialog" class="modal-card">
      <h2>Выберите флешку</h2>
      <div class="drive-list" id="drive-list"></div>
      <button value="cancel" class="secondary-btn">Отмена</button>
    </form>
  </dialog>

  <script>
    const errorEl = document.getElementById('error');
    const continueBtn = document.getElementById('continue-btn');
    const drivesModal = document.getElementById('drives-modal');
    const driveList = document.getElementById('drive-list');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = !msg;
    }

    function openBrowse(path) {
      const url = new URL('/print/usb/browse/', location.origin);
      if (path) url.searchParams.set('path', path);
      location.href = url.toString();
    }

    function showDrivePicker(drives) {
      driveList.innerHTML = '';
      drives.forEach((drive) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'drive-item';
        btn.textContent = drive.label || drive.name;
        btn.addEventListener('click', () => openBrowse(drive.path));
        driveList.appendChild(btn);
      });
      drivesModal.showModal();
    }

    continueBtn.addEventListener('click', async () => {
      showError('');
      continueBtn.disabled = true;
      continueBtn.textContent = 'Проверка…';
      try {
        const res = await fetch('/api/kiosk/usb/browse');
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Флешка не найдена');
          return;
        }
        if (data.drives && data.drives.length > 1) {
          showDrivePicker(data.drives);
          return;
        }
        openBrowse(data.path || (data.drives && data.drives[0] && data.drives[0].path));
      } catch (e) {
        showError('Не удалось проверить USB');
      } finally {
        continueBtn.disabled = false;
        continueBtn.textContent = 'Продолжить';
      }
    });
  </script>
  <script src="/static/ui.js"></script>
  <script src="/static/idle.js"></script>
</body>
</html>
