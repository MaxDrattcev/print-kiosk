<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Файлы на USB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="screen browse-screen">
    <header class="top top-nav browse-top">
      <a class="back-btn" id="back-btn" href="/print/usb/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
      <button type="button" class="text-btn" id="home-usb-btn">К флешке</button>
    </header>

    <section class="browse-header">
      <h1 id="title">Файлы на USB</h1>
      <p id="subtitle">Загрузка…</p>
    </section>

    <p class="error panel-error" id="error" hidden></p>
    <div class="file-list" id="file-list"></div>

    <div class="wave" aria-hidden="true"></div>
  </div>

  <div class="loading-overlay" id="loading-overlay" hidden>
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2>Подготовка документа</h2>
      <p class="muted" id="loading-text">Конвертация файла, пожалуйста подождите…</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    let currentPath = params.get('path') || '';
    let rootPath = '';

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const listEl = document.getElementById('file-list');
    const errorEl = document.getElementById('error');
    const backBtn = document.getElementById('back-btn');
    const homeUsbBtn = document.getElementById('home-usb-btn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    function setLoading(show, fileName) {
      if (show) {
        loadingText.textContent = fileName
          ? 'Конвертация «' + fileName + '», пожалуйста подождите…'
          : 'Конвертация файла, пожалуйста подождите…';
        loadingOverlay.hidden = false;
        document.body.classList.add('loading-lock');
      } else {
        loadingOverlay.hidden = true;
        document.body.classList.remove('loading-lock');
      }
    }

    function formatSize(bytes) {
      if (!bytes && bytes !== 0) return '';
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = !msg;
    }

    function setPath(path) {
      currentPath = path;
      const url = new URL(location.href);
      url.searchParams.set('path', path);
      history.replaceState({}, '', url);
      loadDir(path);
    }

    function renderEntries(data) {
      rootPath = data.root || rootPath;
      titleEl.textContent = data.label || 'USB';
      subtitleEl.textContent = data.path || '';

      if (data.parent) {
        backBtn.href = '#';
        backBtn.onclick = (e) => {
          e.preventDefault();
          setPath(data.parent);
        };
      } else {
        backBtn.href = '/print/usb/';
        backBtn.onclick = null;
      }

      listEl.innerHTML = '';
      if (!data.entries || data.entries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'В этой папке нет поддерживаемых файлов';
        listEl.appendChild(empty);
        return;
      }

      data.entries.forEach((entry) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'file-item';
        item.innerHTML = `
          <span class="file-icon ${entry.is_dir ? 'dir' : 'file'}" aria-hidden="true"></span>
          <span class="file-meta">
            <span class="file-name"></span>
            <span class="file-sub">${entry.is_dir ? 'Папка' : formatSize(entry.size)}</span>
          </span>
          <span class="chevron small">›</span>
        `;
        item.querySelector('.file-name').textContent = entry.name;
        item.addEventListener('click', async () => {
          if (entry.is_dir) {
            setPath(entry.path);
            return;
          }
          item.disabled = true;
          showError('');
          setLoading(true, entry.name);
          try {
            const res = await fetch('/api/kiosk/print/prepare', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: entry.path }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              setLoading(false);
              showError(data.error || 'Не удалось подготовить файл');
              item.disabled = false;
              return;
            }
            loadingText.textContent = 'Документ готов, открываем настройки…';
            location.href = '/print/setup/?job=' + encodeURIComponent(data.job.id);
          } catch (e) {
            setLoading(false);
            showError('Не удалось подготовить файл');
            item.disabled = false;
          }
        });
        listEl.appendChild(item);
      });
    }

    async function loadDir(path) {
      showError('');
      subtitleEl.textContent = 'Загрузка…';
      listEl.innerHTML = '';
      try {
        const url = new URL('/api/kiosk/usb/browse', location.origin);
        if (path) url.searchParams.set('path', path);
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Не удалось открыть флешку');
          subtitleEl.textContent = '';
          return;
        }
        if (data.drives) {
          location.href = '/print/usb/';
          return;
        }
        renderEntries(data);
      } catch (e) {
        showError('Не удалось открыть флешку');
        subtitleEl.textContent = '';
      }
    }

    homeUsbBtn.addEventListener('click', () => {
      if (rootPath) setPath(rootPath);
    });

    loadDir(currentPath);
  </script>
  <script src="/static/idle.js"></script>
</body>
</html>
