<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Файлы на USB</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user">
  <div class="screen browse-screen">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
    </header>
    <header class="top top-nav browse-top">
      <a class="back-btn" id="back-btn" href="/print/usb/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="browse-header">
      <h1 id="title">Файлы на USB</h1>
      <p id="subtitle">Загрузка…</p>
    </section>

    <p class="error panel-error" id="error" hidden></p>
    <div class="file-list" id="file-list"></div>

    <div class="wave" aria-hidden="true"></div>
  </div>

  <div class="loading-overlay" id="loading-overlay" hidden>
    <div class="prepare-magic-card">
      <div class="prepare-magic-glow" aria-hidden="true"></div>
      <div class="prepare-magic-art" aria-hidden="true">
        <span class="prepare-magic-orbit"></span><span class="prepare-magic-source"><i></i></span>
        <img class="prepare-magic-quill" src="/static/img/magic-quill.png" alt="">
        <span class="prepare-magic-pdf"><strong>PDF</strong></span>
        <span class="prepare-magic-spark spark-one"></span><span class="prepare-magic-spark spark-two"></span><span class="prepare-magic-spark spark-three"></span>
      </div>
      <p class="prepare-magic-kicker">Мастерская документов</p>
      <h2>Наводим порядок в страницах</h2>
      <div class="prepare-magic-steps" aria-live="polite"><p>Раскрываем документ заклинанием</p><p>Собираем шрифты и изображения</p><p>Запечатываем всё в аккуратный PDF</p></div>
      <p class="prepare-magic-file" id="loading-text">Подготовка файла…</p>
      <div class="print-magic-progress" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>

  <script>
    const USB_PATH_KEY = 'kiosk_usb_browse_path';
    const params = new URLSearchParams(location.search);
    let currentPath = params.get('path') || '';
    const fromHome = params.get('origin') === 'home';
    let rootPath = '';

    function lastUsbPath() {
      try { return sessionStorage.getItem(USB_PATH_KEY) || ''; } catch (e) { return ''; }
    }

    function rememberUsbPath(path) {
      if (!path) return;
      try { sessionStorage.setItem(USB_PATH_KEY, path); } catch (e) {}
    }

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const listEl = document.getElementById('file-list');
    const errorEl = document.getElementById('error');
    const backBtn = document.getElementById('back-btn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    function setLoading(show, fileName) {
      if (show) {
        loadingText.textContent = fileName
          ? 'Колдуем над файлом «' + fileName + '»'
          : 'Колдуем над выбранным документом';
        loadingOverlay.hidden = false;
        document.body.classList.add('loading-lock');
      } else {
        loadingOverlay.hidden = true;
        document.body.classList.remove('loading-lock');
      }
    }

    function formatSize(bytes) {
      if (!bytes && bytes !== 0) return '';
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = !msg;
    }

    function setPath(path) {
      currentPath = path;
      rememberUsbPath(path);
      const url = new URL(location.href);
      if (path) url.searchParams.set('path', path);
      else url.searchParams.delete('path');
      history.replaceState({}, '', url);
      loadDir(path);
    }

    function renderEntries(data) {
      rootPath = data.root || rootPath;
      if (data.path) {
        currentPath = data.path;
        rememberUsbPath(data.path);
        const url = new URL(location.href);
        url.searchParams.set('path', data.path);
        history.replaceState({}, '', url);
      }
      titleEl.textContent = data.label || 'USB';
      subtitleEl.textContent = data.path || '';

      if (data.parent) {
        backBtn.href = '#';
        backBtn.onclick = (e) => {
          e.preventDefault();
          setPath(data.parent);
        };
      } else {
        backBtn.href = fromHome ? '/print/usb/?origin=home' : '/print/usb/';
        backBtn.onclick = null;
      }

      listEl.innerHTML = '';
      if (!data.entries || data.entries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'В этой папке нет поддерживаемых файлов';
        listEl.appendChild(empty);
        return;
      }

      data.entries.forEach((entry) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'file-item';
        item.innerHTML = `
          <span class="file-icon ${entry.is_dir ? 'dir' : 'file'}" aria-hidden="true"></span>
          <span class="file-meta">
            <span class="file-name"></span>
            <span class="file-sub">${entry.is_dir ? 'Папка' : formatSize(entry.size)}</span>
          </span>
          <span class="chevron small">›</span>
        `;
        item.querySelector('.file-name').textContent = entry.name;
        item.addEventListener('click', async () => {
          if (entry.is_dir) {
            setPath(entry.path);
            return;
          }
          item.disabled = true;
          showError('');
          setLoading(true, entry.name);
          try {
            const res = await fetch('/api/kiosk/print/prepare', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: entry.path }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              setLoading(false);
              showError(data.error || 'Не удалось подготовить файл');
              item.disabled = false;
              return;
            }
            loadingText.textContent = 'Документ готов, открываем настройки…';
            const dir = currentPath || rootPath || lastUsbPath();
            let setup = '/print/setup/?job=' + encodeURIComponent(data.job.id) + '&from=usb';
            if (dir) setup += '&usb_path=' + encodeURIComponent(dir);
            location.href = setup;
          } catch (e) {
            setLoading(false);
            showError('Не удалось подготовить файл');
            item.disabled = false;
          }
        });
        listEl.appendChild(item);
      });
    }

    async function loadDir(path) {
      showError('');
      subtitleEl.textContent = 'Загрузка…';
      listEl.innerHTML = '';
      try {
        const url = new URL('/api/kiosk/usb/browse', location.origin);
        if (path) url.searchParams.set('path', path);
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Не удалось открыть флешку');
          subtitleEl.textContent = '';
          return;
        }
        if (data.drives) {
          const remembered = path || lastUsbPath();
          const match = remembered && data.drives.find((d) =>
            remembered === d.path || String(remembered).indexOf(d.path) === 0
          );
          if (match) {
            setPath(remembered.indexOf(match.path) === 0 && remembered !== match.path ? remembered : match.path);
            return;
          }
          location.href = fromHome ? '/print/usb/?origin=home' : '/print/usb/';
          return;
        }
        renderEntries(data);
      } catch (e) {
        showError('Не удалось открыть флешку');
        subtitleEl.textContent = '';
      }
    }

    if (!currentPath) currentPath = lastUsbPath();
    loadDir(currentPath);
  </script>
  <script src="/static/ui.js"></script>
  <script src="/static/idle.js"></script>
</body>
</html>
