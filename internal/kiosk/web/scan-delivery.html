<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Получить скан — PrintStart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user">
  <div class="screen">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
      <a class="specialist-link" href="/admin/">Вход для специалиста</a>
    </header>
    <header class="top top-nav">
      <a class="back-btn" id="back-btn" href="/scan/name/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="hero compact">
      <h1>Как забрать скан?</h1>
      <p id="file-hint">Выберите способ получения файла</p>
    </section>

    <main class="actions">
      <a class="action-card" id="usb-link" href="#">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="8" rx="1"/>
              <path d="M7 10h10a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3z"/>
              <path d="M10 14h4M10 17h4"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Сохранить на USB</div>
          <div class="action-description">Скопировать файл на флешку</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="action-card green" id="email-link" href="#">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 7 9-7"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить на Email</div>
          <div class="action-description">Получить PDF на почту</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="action-card max" id="max-link" href="#">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="maxGradScan" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00BFFF"/>
                  <stop offset="0.45" stop-color="#471AFF"/>
                  <stop offset="1" stop-color="#9500FF"/>
                </linearGradient>
              </defs>
              <path fill="url(#maxGradScan)" fill-rule="evenodd" d="M12 2.8c-5.1 0-9.2 3.7-9.2 8.3 0 2.8 1.5 5.3 3.9 6.8L4.8 21.2c-.25.35.1.82.52.72l4.05-.95c.82.22 1.7.33 2.63.33 5.1 0 9.2-3.7 9.2-8.3S17.1 2.8 12 2.8zm0 3.4c3.55 0 6.4 2.55 6.4 5.7s-2.85 5.7-6.4 5.7c-.95 0-1.85-.15-2.65-.42l-.35-.12-2.35 1.08.55-2.28-.2-.2C6.05 14.5 5.6 13.3 5.6 11.9c0-3.15 2.85-5.7 6.4-5.7z"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить в MAX</div>
          <div class="action-description" id="max-desc">Получить PDF в мессенджер</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job');
    document.getElementById('back-btn').href = '/scan/name/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('usb-link').href = '/scan/usb/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('email-link').href = '/scan/email/?job=' + encodeURIComponent(jobId || '');
    const maxLink = document.getElementById('max-link');
    maxLink.href = '/scan/max/?job=' + encodeURIComponent(jobId || '');

    (async () => {
      try {
        const info = await fetch('/api/kiosk/max/info').then((r) => r.json()).catch(() => ({}));
        if (!info.enabled) {
          maxLink.classList.add('disabled');
          maxLink.removeAttribute('href');
          document.getElementById('max-desc').textContent = 'Не активирован в настройках';
          maxLink.style.opacity = '0.55';
          maxLink.style.pointerEvents = 'none';
        }
      } catch (e) {}
      if (!jobId) return;
      const res = await fetch('/api/kiosk/scan/jobs/' + encodeURIComponent(jobId));
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.job) {
        document.getElementById('file-hint').textContent = 'Файл: ' + data.job.file_name;
      }
    })();
  </script>
  <script src="/static/ui.js"></script>
  <script src="/static/idle.js"></script>
</body>
</html>
