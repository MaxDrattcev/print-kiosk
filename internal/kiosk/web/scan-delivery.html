<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Получить скан — PrintStart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user scan-delivery-page">
  <div class="screen">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
    </header>
    <header class="top top-nav">
      <a class="back-btn" id="back-btn" href="/scan/name/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <div class="scan-delivery-stage">
    <section class="hero compact">
      <h1>Как забрать скан?</h1>
      <p id="file-hint">Выберите способ получения файла</p>
    </section>

    <main class="actions">
      <a class="source-card" id="usb-link" href="#">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--usb" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">Сохранить на USB</div>
          <div class="action-description">Скопировать файл на флешку</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="source-card green" id="email-link" href="#">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--mail" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить на Email</div>
          <div class="action-description">Получить PDF на почту</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="source-card max" id="max-link" href="#">
        <div class="action-visual">
          <div class="action-icon print-source-icon print-source-icon--max" aria-hidden="true"></div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить в MAX</div>
          <div class="action-description" id="max-desc">Получить PDF в мессенджер</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>
    </main>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job');
    document.getElementById('back-btn').href = '/scan/name/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('usb-link').href = '/scan/usb/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('email-link').href = '/scan/email/?job=' + encodeURIComponent(jobId || '');
    const maxLink = document.getElementById('max-link');
    maxLink.href = '/scan/max/?job=' + encodeURIComponent(jobId || '');

    (async () => {
      try {
        const info = await fetch('/api/kiosk/info').then((r) => r.json()).catch(() => ({}));
        const usb = document.getElementById('usb-link');
        const email = document.getElementById('email-link');
        const max = document.getElementById('max-link');
        if (usb) usb.hidden = info.source_usb === false;
        if (email) email.hidden = info.source_email !== true;
        if (max) max.hidden = info.source_max !== true;
      } catch (e) {}
      if (!jobId) return;
      const res = await fetch('/api/kiosk/scan/jobs/' + encodeURIComponent(jobId));
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.job) {
        document.getElementById('file-hint').textContent = 'Файл: ' + data.job.file_name;
      }
    })();
  </script>
  <script src="/static/ui.js"></script>
  <script src="/static/scan-exit.js"></script>
  <script src="/static/idle.js"></script>
</body>
</html>
