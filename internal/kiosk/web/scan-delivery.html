<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Получить скан — PrintStart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="screen">
    <header class="top top-nav">
      <a class="back-btn" id="back-btn" href="/scan/name/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="hero compact">
      <h1>Как забрать скан?</h1>
      <p id="file-hint">Выберите способ получения файла</p>
    </section>

    <main class="actions">
      <a class="action-card" id="usb-link" href="#">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="8" rx="1"/>
              <path d="M7 10h10a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3z"/>
              <path d="M10 14h4M10 17h4"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Сохранить на USB</div>
          <div class="action-description">Скопировать файл на флешку</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <a class="action-card green" id="email-link" href="#">
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 7 9-7"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить на Email</div>
          <div class="action-description">Получить PDF на почту</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </a>

      <button type="button" class="action-card purple" id="tg-btn" disabled>
        <div class="action-visual">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 5L2 12.5l6.5 1.8L16 9l-6 7.2 1.2 5.3L21 5z"/>
            </svg>
          </div>
        </div>
        <div class="action-text">
          <div class="action-title">Отправить в Telegram</div>
          <div class="action-description">Скоро будет доступно</div>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </button>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job');
    document.getElementById('back-btn').href = '/scan/name/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('usb-link').href = '/scan/usb/?job=' + encodeURIComponent(jobId || '');
    document.getElementById('email-link').href = '/scan/email/?job=' + encodeURIComponent(jobId || '');

    (async () => {
      if (!jobId) return;
      const res = await fetch('/api/kiosk/scan/jobs/' + encodeURIComponent(jobId));
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.job) {
        document.getElementById('file-hint').textContent = 'Файл: ' + data.job.file_name;
      }
    })();
  </script>
  <script src="/static/idle.js"></script>
</body>
</html>
