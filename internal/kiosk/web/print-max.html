<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Печать с MAX — PrintStart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kiosk-user">
  <div class="screen">
    <header class="app-header app-header--inner">
      <a class="brand" href="/">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V3h12v6"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="7" rx="1"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PrintStart</div>
          <div class="brand-subtitle">Сервис печати</div>
        </div>
      </a>
    </header>
    <header class="top top-nav">
      <a class="back-btn" id="back-btn" href="/print/">
        <span aria-hidden="true">‹</span>
        Назад
      </a>
    </header>

    <section class="prompt-card">
      <h1>Подключаем MAX…</h1>
      <p>Готовим QR-код и ожидание вашего файла.</p>
      <p class="error" id="error" hidden></p>
      <button type="button" class="primary-btn" id="sent-btn" disabled>Попробовать снова</button>
    </section>
  </div>

  <script>
    const entryParams = new URLSearchParams(location.search);
    const fromHome = entryParams.get('origin') === 'home';
    document.getElementById('back-btn').href = fromHome ? '/' : '/print/';
    const errorEl = document.getElementById('error');
    const sentBtn = document.getElementById('sent-btn');
    const params = new URLSearchParams(location.search);

    function showError(msg) {
      errorEl.textContent = msg || '';
      errorEl.hidden = !msg;
    }

    async function startWaiting() {
      showError('');
      sentBtn.disabled = true;
      try {
        const res = await fetch('/api/kiosk/max/print/sessions', { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Не удалось начать ожидание файла');
          sentBtn.disabled = false;
          return;
        }
        location.replace('/print/max/wait/?session=' + encodeURIComponent(data.session.id) + (fromHome ? '&origin=home' : ''));
      } catch (e) {
        showError('Ошибка связи с сервером');
        sentBtn.disabled = false;
      }
    }
    sentBtn.addEventListener('click', startWaiting);
    if (params.get('timeout') === '1') {
      document.querySelector('h1').textContent = 'Время ожидания истекло';
      showError('Нажмите «Попробовать снова», затем отправьте файл боту.');
      sentBtn.disabled = false;
    } else {
      startWaiting();
    }
  </script>
  <script src="/static/ui.js"></script>
  <script src="/static/idle.js"></script>
</body>
</html>
