<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Вход для специалиста — PRINTUS</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <main class="auth-page">
    <form class="card auth-card" id="login-form">
      <div class="auth-brand" aria-label="PRINTUS — Магия цветной печати">
        <span class="auth-brand-icon" aria-hidden="true"></span>
        <span><strong>PRINTUS</strong><small>Магия цветной печати</small></span>
      </div>
      <p class="admin-eyebrow">Закрытая зона</p>
      <h1>Вход для специалиста</h1>
      <p class="muted">Управление терминалом, оборудованием и подключениями</p>

      <label>
        Логин
        <input type="text" name="username" autocomplete="off" inputmode="none" required autofocus>
      </label>

      <label>
        Пароль
        <span class="auth-password-wrap">
          <input type="password" name="password" autocomplete="off" inputmode="none" required>
          <button type="button" class="auth-password-toggle" id="password-toggle" aria-label="Показать пароль" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </button>
        </span>
      </label>

      <p class="error" id="error" hidden></p>

      <button type="submit">Войти</button>
      <a class="back-link" href="/">← Вернуться в основное меню</a>
    </form>
  </main>

  <script src="/admin/keyboard.js"></script>
  <script>
    KioskKeyboard.bind(document);

    async function ensureGuest() {
      const res = await fetch('/api/admin/me', { credentials: 'same-origin' });
      if (res.ok) {
        location.href = '/admin/settings.html#overview';
      }
    }

    ensureGuest();

    const passwordToggle = document.getElementById('password-toggle');
    const passwordInput = document.querySelector('input[name="password"]');
    passwordToggle.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      passwordToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
      passwordToggle.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
      passwordInput.focus();
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.hidden = true;

      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Проверяем…';
      const body = {
        username: form.username.value.trim(),
        password: form.password.value,
      };

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Ошибка входа');
        location.href = '/admin/settings.html#overview';
      } catch (error) {
        errorEl.textContent = error.message || 'Не удалось связаться с сервером';
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
